apiVersion: v2
name: saveroom
description: >-
  Saveroom (a FOSS fork of Baserow) for Kubernetes, OpenShift and Amazon EKS. Deploys the
  backend, web-frontend and Celery workers as separate hardened pods that run
  unmodified under OpenShift's restricted-v2 SCC (arbitrary UID, non-root, no
  privileged ports). Routing is via Ingress, an AWS ALB IngressGroup, or
  OpenShift Routes. S3 media can authenticate with static keys, EKS IRSA or EKS
  Pod Identity. PostgreSQL and Redis are optional, toggleable subcharts; point
  at an external managed database instead by disabling them.
type: application
keywords:
  - saveroom
  - baserow
  - no-code
  - database
  - openshift
  - eks
version: 0.9.0
# Tracks the application version shipped by this fork's images.
appVersion: "0.15.0"
home: https://github.com/carneirofc/baserow
sources:
  - https://github.com/carneirofc/baserow
maintainers:
  - name: carneirofc
    email: claudiofcarneiro@gmail.com

annotations:
  artifacthub.io/changes: |
    - kind: removed
      description: >-
        Dropped the /mcp and /assistant backend routes; the MCP server and the
        AI assistant they served are removed.
    - kind: changed
      description: >-
        Renamed the chart to saveroom, published at
        oci://ghcr.io/carneirofc/baserow/charts/saveroom. Resource names and
        selector labels keep the baserow name, so existing releases upgrade in
        place.
    - kind: added
      description: >-
        branding.appName also reaches the backend and Celery pods, for the
        product name in emails and the API docs.

dependencies:
  - name: postgresql
    version: "~18.12.0"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "~28.3.0"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
