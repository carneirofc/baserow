name: Publish Helm Chart

# Packages deploy/helm/baserow and publishes it as an installable artifact.
# On pull requests touching the chart the workflow only lints, renders and
# packages (uploading the .tgz as a workflow artifact for inspection). On
# version tags it additionally pushes the chart as an OCI package to this
# repo's GitHub Container Registry, using only the built-in GITHUB_TOKEN.
#
# Result:
#   oci://ghcr.io/<owner>/<repo>/charts/baserow:<chart version>
#   (install with: helm install baserow oci://ghcr.io/<owner>/<repo>/charts/baserow)
#
# The chart version is taken from Chart.yaml (bumped manually per
# deploy/AGENTS.md), not from the git tag — the v* tag only marks a release
# point at which the chart, like the images, is published.

on:
  pull_request:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/publish-helm-chart.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also push the chart to GHCR (not just package it)"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  CHART_DIR: deploy/helm/baserow

jobs:
  package:
    name: Lint, package & publish chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # The subchart .tgz files under charts/ are git-ignored; rebuild them
      # from the committed Chart.lock so packaging is reproducible.
      - name: Fetch chart dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm dependency build "$CHART_DIR"

      - name: Lint chart (default and OpenShift values)
        run: |
          helm lint "$CHART_DIR"
          helm lint "$CHART_DIR" -f "$CHART_DIR/values-openshift.yaml"

      - name: Render templates as a smoke test
        run: |
          helm template baserow "$CHART_DIR" > /dev/null
          helm template baserow "$CHART_DIR" -f "$CHART_DIR/values-openshift.yaml" > /dev/null

      - name: Package chart
        id: package
        run: |
          helm package "$CHART_DIR" --destination dist
          tgz="$(ls dist/*.tgz)"
          echo "path=$tgz" >> "$GITHUB_OUTPUT"
          echo "version=$(basename "$tgz" .tgz | sed 's/^baserow-//')" >> "$GITHUB_OUTPUT"

      - name: Upload packaged chart as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: baserow-helm-chart-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login "$REGISTRY" \
            --username "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR (OCI)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        run: |
          helm push "${{ steps.package.outputs.path }}" \
            "oci://${REGISTRY}/${{ github.repository }}/charts"
