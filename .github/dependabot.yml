version: 2
updates:
  # =============================================================================
  # npm ecosystems
  # =============================================================================
  # Note: We only monitor directories with actual dependencies declared.
  # /integrations/zapier is excluded intentionally.

  - package-ecosystem: "npm"
    directory: "/web-frontend"
    schedule:
      interval: "monthly"

  # =============================================================================
  # uv (Python) ecosystem
  # =============================================================================
  # Note: We only monitor /backend, which declares all Python dependencies in
  # backend/pyproject.toml and resolves them in backend/uv.lock.

  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
